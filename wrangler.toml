name = "glass-expert"
type = "javascript"
compatibility_date = "2024-12-16"
pages_build_caching = true

# Static site in root directory
[build]
command = "echo 'Static HTML site'"
watch_paths = ["*.html", "css/**", "js/**", "images/**"]

# D1 Database Binding for VAGOTECH Analytics
[[d1_databases]]
binding = "VAGOTECH_DB"
database_name = "vagotech_analytics"
database_id = "e0d9934c-2e9e-4f9c-88b8-83bc679d16dc"

# D1 Database Binding for Glass Expert CRM
# IMPORTANT: Înlocuiește database_id cu ID-ul real după ce creezi DB-ul în Cloudflare Dashboard
# Dashboard → Workers & Pages → D1 → Create database (name: glas-expert-crm)
[[d1_databases]]
binding = "DB"
database_name = "glas-expert-crm"
database_id = "c3af7e2d-326e-4f05-9b74-92fc42cd0241"

# Environment Variables
[env.production.vars]
ANALYTICS_ENABLED = "true"
DATA_RETENTION_DAYS = "999999"

# NOTE: Admin password stored in Cloudflare Secrets (not in this file)
# Set in Cloudflare Dashboard > Settings > Environment Variables > Secrets
# ADMIN_PASSWORD = your-secret-password-here (use Cloudflare UI, never commit to git)
