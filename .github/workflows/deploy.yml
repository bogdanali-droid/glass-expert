name: Deploy to Cloudflare Pages with Performance Verification

on:
  push:
    branches:
      - claude/gallant-meitner-UJzXt
  pull_request:
    branches:
      - claude/gallant-meitner-UJzXt

jobs:
  validation:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Check File Sizes
        run: |
          echo "=== Asset Sizes ==="
          echo "HTML files:"
          du -h *.html
          echo "CSS:"
          du -h css/
          echo "JavaScript:"
          du -h js/
          echo "Total size:"
          du -sh .

      - name: Validate Critical Files
        run: |
          echo "Checking critical files exist..."
          test -f index.html && echo "✓ index.html found"
          test -f css/style.css && echo "✓ css/style.css found"
          test -f js/script.js && echo "✓ js/script.js found"
          echo "All critical files present"

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: validation
    if: github.event_name == 'push'
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=glass-expert
          secrets: |
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID

      - name: Deployment Verification
        id: verify
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 5

          URL="https://glass-expert.pages.dev"
          echo "Verifying deployment at: $URL"

          # Check site is up
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$RESPONSE" = "200" ]; then
            echo "✓ Site is live and responding (HTTP $RESPONSE)"
            echo "deployment_status=success" >> $GITHUB_OUTPUT
          else
            echo "✗ Site returned HTTP $RESPONSE"
            echo "deployment_status=failed" >> $GITHUB_OUTPUT
          fi

          # Check critical pages
          for page in index.html commercial.html hospitality.html healthcare.html education.html; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/$page")
            echo "[$page]: HTTP $CODE"
          done

          # Check assets
          CSS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/css/style.css")
          echo "[css/style.css]: HTTP $CSS_CODE"

          JS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/js/script.js")
          echo "[js/script.js]: HTTP $JS_CODE"

      - name: Notify Deployment Complete
        if: success()
        run: |
          echo "Deployment verified successfully!"
          echo "Site live at: https://glass-expert.pages.dev/"
          echo "Commit: ${{ github.sha }}"
