name: Validate Website Files

on:
  push:
    branches:
      - claude/gallant-meitner-UJzXt
  pull_request:
    branches:
      - claude/gallant-meitner-UJzXt

jobs:
  validation:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Verify All HTML Files
        run: |
          echo "=== Checking HTML Files ==="
          test -f index.html && echo "✓ index.html exists" || exit 1
          test -f commercial.html && echo "✓ commercial.html exists" || exit 1
          test -f hospitality.html && echo "✓ hospitality.html exists" || exit 1
          test -f healthcare.html && echo "✓ healthcare.html exists" || exit 1
          test -f education.html && echo "✓ education.html exists" || exit 1

      - name: Verify CSS & JS
        run: |
          echo "=== Checking CSS & JavaScript ==="
          test -f css/style.css && echo "✓ css/style.css exists" || exit 1
          test -f css/polish-enhancements.css && echo "✓ css/polish-enhancements.css exists" || exit 1
          test -f js/script.js && echo "✓ js/script.js exists" || exit 1

      - name: File Size Check
        run: |
          echo "=== File Sizes ==="
          du -sh .
          du -h *.html
          du -h css/*
          du -h js/*

      - name: Summary
        run: |
          echo ""
          echo "✅ Website validation PASSED"
          echo "✅ All critical files present"
          echo "✅ Ready for Cloudflare Pages deployment"
          echo ""
          echo "Files ready:"
          ls -la *.html
          ls -la css/
          ls -la js/
